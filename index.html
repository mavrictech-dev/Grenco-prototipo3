    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "name": "GRENCO — Grupo Enriquez Construcciones S.A.C.",
        "url": "https://grenco.pe",
        "email": "contacto@grenco.pe",
        "areaServed": ["Piura", "La Libertad"],
        "address": [
          {
            "@type": "PostalAddress",
            "addressLocality": "Piura",
            "addressCountry": "PE"
          },
          {
            "@type": "PostalAddress",
            "addressLocality": "Trujillo",
            "addressRegion": "La Libertad",
            "addressCountry": "PE"
          }
        ]
      }
    </script>

    <script>
      // Aplica la sede y su tema correspondiente antes del primer pintado:
      // Piura = claro (cielo azul), Trujillo = oscuro (cielo azul noche).
      (function () {
        try {
          var sede = localStorage.getItem('grenco.sede');
          if (sede !== 'piura' && sede !== 'trujillo') sede = 'piura';
          var theme = sede === 'trujillo' ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-sede', sede);
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-sede', 'piura');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
