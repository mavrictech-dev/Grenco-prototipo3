<!doctype html>
<html lang="es" data-sede="piura">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9e6e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e2024" media="(prefers-color-scheme: dark)" />

    <title>GRENCO · Movimiento de tierras y obra civil en Piura y Trujillo</title>
    <meta
      name="description"
      content="Grupo Enriquez Construcciones: movimiento de tierras, obra civil, habilitación urbana y alquiler de maquinaria pesada con flota y cuadrillas propias en Piura y La Libertad."
    />
    <link rel="canonical" href="https://grenco.pe/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GRENCO" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="GRENCO · Movemos tierra. Levantamos el norte." />
    <meta
      property="og:description"
      content="Movimiento de tierras, obra civil y alquiler de maquinaria pesada en Piura y La Libertad. Flota propia, cuadrillas propias, plazos firmados."
    />
    <meta property="og:url" content="https://grenco.pe/" />
    <meta property="og:image" content="https://grenco.pe/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      LCP: el poster del primer panel del triptico. Se pinta antes de que el
      video tenga un solo fotograma, asi que es lo que mide Lighthouse. Su ruta
      no lleva hash (vive en public/), por eso se puede precargar desde aqui.
    -->
    <link rel="preload" as="image" href="/video/obra-1.webp" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "name": "GRENCO — Grupo Enriquez Construcciones S.A.C.",
        "url": "https://grenco.pe",
        "email": "contacto@grenco.pe",
        "areaServed": ["Piura", "La Libertad"],
        "address": [
          {
            "@type": "PostalAddress",
            "addressLocality": "Piura",
            "addressCountry": "PE"
          },
          {
            "@type": "PostalAddress",
            "addressLocality": "Trujillo",
            "addressRegion": "La Libertad",
            "addressCountry": "PE"
          }
        ]
      }
    </script>

    <script>
      // Aplica el tema antes del primer pintado. Sin esto la pagina parpadea
      // en claro durante un frame antes de que React monte y ponga el oscuro.
      (function () {
        try {
          var saved = localStorage.getItem('grenco.theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;

          var sede = localStorage.getItem('grenco.sede');
          if (sede === 'piura' || sede === 'trujillo') root.setAttribute('data-sede', sede);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font: 400 16px/1.6 system-ui, sans-serif">
        Esta página necesita JavaScript. Escríbenos a
        <a href="mailto:contacto@grenco.pe">contacto@grenco.pe</a> o al
        <a href="https://wa.me/51900000000">WhatsApp +51 900 000 000</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
