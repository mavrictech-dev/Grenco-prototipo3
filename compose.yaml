services:
  app:
    build:
      context: .
      args:
        VITE_FORM_ENDPOINT: ${VITE_FORM_ENDPOINT:-}
        VITE_FORM_ACCESS_KEY: ${VITE_FORM_ACCESS_KEY:-}
    restart: unless-stopped
    networks:
      - private

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Define SITE_DOMAIN en el archivo .env del servidor}
      CADDY_EMAIL: ${CADDY_EMAIL:?Define CADDY_EMAIL en el archivo .env del servidor}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
